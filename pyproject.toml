[tool.poetry]
name = "supercat"
version = "0.3.1"
description = "A deep learning model for CT scan super-resolution."
authors = ["MDAP <robert.turnbull@unimelb.edu.au>"]
license = "Apache Software License 2.0"
readme = "README.rst"
homepage = "https://rbturnbull.github.io/supercat/"
repository = "https://github.com/rbturnbull/supercat"
documentation = "https://rbturnbull.github.io/supercat/"
keywords = ["super-resolution", "Computed tomography (CT)", "torchapp", "rock", "sand", "3D", "diffusion"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
widitapp = ">=0.1.13"
scikit-image = ">=0.25.2"
hdf5storage = ">=0.2.1"
plotly = ">=6.6.0"
kaleido = ">=1.2.0"
imageio = {version = ">=2.37.0", extras = ["ffmpeg"]}
scikit-video = "^1.1.11"

[tool.poetry.group.dev.dependencies]
pytest = ">=6.2.5"
ipykernel = ">=6.6.1"
coverage = ">=5.5"
autopep8 = ">=1.5.7"
Sphinx = ">=4.2.0"
nbsphinx = ">=0.8.7"
sphinx-rtd-theme = ">=1.0.0"
sphinx-autobuild = ">=2021.3.14"
myst-parser = ">=0.15.2"
pre-commit = ">=2.15.0"
sphinx-copybutton = ">=0.4.0"
black = ">=21.10b0"
sphinx-click = {git = "https://github.com/rbturnbull/sphinx-click.git"}

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]

[build-system]
requires = ["setuptools","poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
supercat = "supercat.apps:Supercat.main"
supercat-tools = "supercat.apps:Supercat.tools"
supercat-pretrain-image = "supercat.pretrain:SupercatPretrainImage.tools"
supercat-pretrain-movie = "supercat.pretrain:SupercatPretrainMovie.tools"
